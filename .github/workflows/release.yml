name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - id: version
        run: node scripts/release-version.cjs

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Set build version
        shell: bash
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
      - name: Test desktop UI
        if: matrix.platform == 'darwin' && matrix.arch == 'x64'
        run: npm run test:renderer
      - name: Build macOS
        if: matrix.platform == 'darwin'
        shell: bash
        run: npm run package:mac -- --arch="$RELEASE_ARCH"
      - name: Build Windows
        if: matrix.platform == 'win32'
        run: npm run package:win
      - name: Verify packaged version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), asar = require('@electron/asar');
          const root = path.join('dist', `Remote Codex-${process.env.RELEASE_PLATFORM}-${process.env.RELEASE_ARCH}`);
          const resources = process.env.RELEASE_PLATFORM === 'darwin' ? path.join(root, 'Remote Codex.app/Contents/Resources') : path.join(root, 'resources');
          const app = JSON.parse(asar.extractFile(path.join(resources, 'app.asar'), 'package.json'));
          if (app.version !== process.env.RELEASE_VERSION) throw new Error('Packaged app version does not match release.');
          fs.mkdirSync('release-assets', { recursive: true });
          NODE
      - name: Archive macOS app
        if: matrix.platform == 'darwin'
        shell: bash
        run: ditto -c -k --norsrc --noextattr --noacl --keepParent "dist/Remote Codex-darwin-$RELEASE_ARCH/Remote Codex.app" "release-assets/Remote-Codex-$RELEASE_VERSION-macos-$RELEASE_ARCH.zip"
      - name: Archive Windows app
        if: matrix.platform == 'win32'
        shell: pwsh
        run: Compress-Archive -Path 'dist/Remote Codex-win32-x64' -DestinationPath "release-assets/Remote-Codex-$env:RELEASE_VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        shell: bash
        run: |
          cd release-assets
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          sha256sum *.zip > SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-is-draft")" = false ]; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --draft --generate-notes --title "Remote Codex $RELEASE_VERSION"
          fi
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
